services:
  db:
    image: postgis/postgis:17-3.5
    container_name: ftth-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ftth_system
      POSTGRES_USER: ftth_admin
      POSTGRES_PASSWORD: ftth_local_dev
    ports:
      - "5432:5432"
    volumes:
      - ftth_postgis_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftth_admin -d ftth_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ftth_postgis_data:
